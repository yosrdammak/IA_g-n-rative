version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartcampus_DB
    restart: always
    environment:
      POSTGRES_USER: smartuser
      POSTGRES_PASSWORD: smartpassword
      POSTGRES_DB: smartcampus_DB
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcampus_BACK
    restart: always
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://smartuser:smartpassword@postgres:5432/smartcampus_DB
    volumes:
      - ./backend:/app
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcampus_FRONT
    restart: always
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
